name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Show toolchain
        run: rustc --version && cargo --version

      # eframe/wgpu and winit need the windowing dev packages on Linux.
      # rfd uses xdg-portal, so GTK is deliberately not installed.
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libvulkan-dev mesa-vulkan-drivers \
            fonts-dejavu-core fontconfig

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Python driver parses
        run: python3 -m py_compile sage/driver.py tests/fixtures/fake_driver.py

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit + fixture integration tests
        run: cargo test --all-targets --locked

      - name: Build both binaries
        run: cargo build --release --locked

      - name: Smoke-test framing without Sage
        run: |
          ./target/release/sadrive --fake-driver -e latex -e raise -e '1+1' --introspect
          ./target/release/sadrive --fake-driver -e hang --interrupt-after 0.5 -e '1+1'
          set +e
          ./target/release/sadrive --fake-driver -e die
          test $? -eq 1
