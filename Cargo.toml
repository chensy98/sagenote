[package]
name = "sagenote"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust-native SageMath notebook (wxMaxima-flavoured)"
license = "MIT OR Apache-2.0"
default-run = "sagenote"

[lib]
name = "sagenote"
path = "src/lib.rs"

[[bin]]
name = "sagenote"
path = "src/main.rs"

[[bin]]
name = "sadrive"
path = "src/bin/sadrive.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
env_logger = "0.11"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4"
# RaTeX is 0.1.x; pin the four crates to the same release so a parser/layout
# mismatch is impossible.  The design's wrapper is src/render.rs.
ratex-katex-fonts = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-types = "=0.1.15"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"
ttf-parser = "0.25"
usvg = "0.48"
uuid = { version = "1", features = ["v4", "serde"] }

# rfd is target-scoped: the Linux build uses xdg-portal/Wayland (no GTK); macOS
# uses the AppKit panels.  Never pull GTK into the Linux binary.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
